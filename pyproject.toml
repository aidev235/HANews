[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hanews"
version = "0.1.0"
description = "Auditable weekly harmonic-analysis research news"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["pydantic==2.11.7", "PyYAML==6.0.2", "jsonschema==4.25.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.7"]

[project.scripts]
hanews = "hanews.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hanews"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Compact domain declarations intentionally group closely related fields and operations.
ignore = ["E401", "E701", "E702", "E731", "F403", "F405"]
