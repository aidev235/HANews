name: Generate weekly HANews

on:
  schedule:
    # Monday 13:15 UTC. The pipeline computes the previous complete ISO week
    # in America/Chicago, so DST does not change reporting boundaries.
    - cron: "15 13 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "Optional ISO week, for example 2026-W36"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: hanews-weekly
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install HANews
        run: python -m pip install .

      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v

      - name: Generate, validate, commit, and push
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REQUESTED_WEEK: ${{ inputs.week }}
        run: |
          if [ -n "$REQUESTED_WEEK" ]; then
            hanews generate --week "$REQUESTED_WEEK"
          else
            hanews generate
          fi

      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hanews-failure-logs-${{ github.run_id }}
          path: |
            logs/generation.log
            logs/runs/*.json
          if-no-files-found: warn
          retention-days: 30

