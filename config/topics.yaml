harmonic_analysis:
  core:
    - Fourier restriction
    - Kakeya and Nikodym problems
    - decoupling inequalities
    - oscillatory and Fourier integral operators
    - local smoothing
    - maximal functions and maximal averages
    - Radon transforms
    - singular integrals and Calderon-Zygmund theory
    - time-frequency analysis and Carleson-type problems
    - Bochner-Riesz problems
  adjacent:
    - geometric measure theory with substantial harmonic-analytic content
    - incidence geometry using harmonic-analytic methods
    - dispersive PDE with central harmonic analysis
    - wave packets and polynomial partitioning
    - variable-coefficient harmonic analysis
  exclusion_guidance:
    - A passing mention of a Fourier transform is not sufficient.
    - Separate direct, strongly adjacent, superficial, and unrelated items.

general_mathematics:
  guidance:
    - Prefer substantial new results, major surveys, and significant research developments.
    - Do not reward routine publication volume or institutional prestige by itself.

